[workspace]
resolver = "3"
members = ["slint-realtime-plot", "demo"]

# Slint is pinned to a known-good rev for reproducible access to the
# wgpu 30 integration; wgpu's major version must match slint's.
[workspace.dependencies]
slint-realtime-plot = { path = "slint-realtime-plot" }
bytemuck = { version = "1.25.0", features = ["derive"] }
png = "0.18.1"
slint = { git = "https://github.com/slint-ui/slint.git", rev = "64ee54de49999a97d97ffe004e30904e8e9118a3", version = "1.18.0", default-features = false, features = ["std", "unstable-wgpu-30", "compat-1-2"] }
slint-build = { git = "https://github.com/slint-ui/slint.git", rev = "64ee54de49999a97d97ffe004e30904e8e9118a3", version = "1.18.0" }
wgpu = { version = "30", features = ["wgsl"] }
