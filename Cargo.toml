[workspace]
resolver = "3"
members = ["slint-realtime-plot", "demo"]

# Slint is pinned to a released version for reproducible access to the
# wgpu 30 integration; wgpu's major version must match slint's.
[workspace.dependencies]
slint-realtime-plot = { path = "slint-realtime-plot" }
bytemuck = { version = "1.25.0", features = ["derive"] }
png = "0.18.1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "unstable-wgpu-30", "compat-1-2"] }
slint-build = "=1.18.1"
wgpu = { version = "30", features = ["wgsl"] }
