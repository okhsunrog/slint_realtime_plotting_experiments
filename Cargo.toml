[package]
name = "slint_realtime_plotting_experiments"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "slint_realtime_plotting_experiments"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg-wgpu"]
android = ["slint/backend-android-activity-06"]

# Pinned to a known-good rev for reproducible access to the wgpu 30 integration.
[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
png = "0.18.1"
slint = { git = "https://github.com/slint-ui/slint.git", rev = "64ee54de49999a97d97ffe004e30904e8e9118a3", version = "1.18.0", default-features = false, features = ["std", "unstable-wgpu-30", "accessibility", "compat-1-2"] }
wgpu = { version = "30", features = ["wgsl"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint.git", rev = "64ee54de49999a97d97ffe004e30904e8e9118a3", version = "1.18.0" }
