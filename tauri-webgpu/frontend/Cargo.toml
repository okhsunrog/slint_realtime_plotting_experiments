[package]
name = "plot-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
console_error_panic_hook = "0.1.7"
futures-channel = "0.3.34"
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
plot-wire = { version = "0.1.0", path = "../wire" }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlInputElement", "HtmlSelectElement", "Performance", "WebSocket", "BinaryType", "MessageEvent", "ErrorEvent", "WheelEvent", "PointerEvent", "DomRect", "Event", "console", "Location", "HtmlElement", "MouseEvent", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlVertexArrayObject", "WebGlUniformLocation", "OffscreenCanvas"] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }

[lib]
crate-type = ["cdylib", "rlib"]
