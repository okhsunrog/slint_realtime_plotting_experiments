[workspace]
resolver = "3"
members = ["frontend", "src-tauri", "wire"]
default-members = ["wire"]

[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
tauri = { git = "https://github.com/okhsunrog/tauri", rev = "eed19f2a394c868761c7e78a1c0b2b010dcfbde0" }
tauri-build = { git = "https://github.com/okhsunrog/tauri", rev = "eed19f2a394c868761c7e78a1c0b2b010dcfbde0" }
tauri-runtime = { git = "https://github.com/okhsunrog/tauri", rev = "eed19f2a394c868761c7e78a1c0b2b010dcfbde0" }
tauri-utils = { git = "https://github.com/okhsunrog/tauri", rev = "eed19f2a394c868761c7e78a1c0b2b010dcfbde0" }
tauri-macros = { git = "https://github.com/okhsunrog/tauri", rev = "eed19f2a394c868761c7e78a1c0b2b010dcfbde0" }
tauri-codegen = { git = "https://github.com/okhsunrog/tauri", rev = "eed19f2a394c868761c7e78a1c0b2b010dcfbde0" }
cef = { git = "https://github.com/okhsunrog/cef-rs", rev = "65c8220a20f3991934e7626b5280d2e660ac860c" }
