[package]
name = "tauri-webgpu-plot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
env_logger = "0.11.11"
futures-util = { version = "0.3.34", features = ["sink"] }
plot-wire = { version = "0.1.0", path = "../wire" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { git = "https://github.com/okhsunrog/tauri", rev = "4ef077937178c9369a4e1205ec29b0163f4324a7", version = "3.0.0-alpha.5" }
tauri-runtime-cef = { version = "3.0.0-alpha.6", features = ["devtools"], git = "https://github.com/okhsunrog/tauri", rev = "4ef077937178c9369a4e1205ec29b0163f4324a7", optional = true }
tauri-runtime-wry = { git = "https://github.com/okhsunrog/tauri", rev = "4ef077937178c9369a4e1205ec29b0163f4324a7", version = "3.0.0-alpha.5", features = ["devtools"], optional = true }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
tauri-build = { git = "https://github.com/okhsunrog/tauri", rev = "4ef077937178c9369a4e1205ec29b0163f4324a7", version = "3.0.0-alpha.4" }

[features]
default = ["custom-protocol", "cef"]
custom-protocol = ["tauri/custom-protocol"]
cef = ["dep:tauri-runtime-cef"]
webkit = ["dep:tauri-runtime-wry"]
