[package]
name = "slint_realtime_plotting_experiments"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "slint_realtime_plotting_experiments"
path = "src/main.rs"

[features]
default = ["desktop"]
# renderer-skia repaints the scene ~7x cheaper than renderer-femtovg-wgpu
# here (measured: 12% vs 87% of a core at 60 fps) and stops missing vsync.
desktop = ["slint/backend-winit", "slint/renderer-skia"]
android = ["slint/backend-android-activity-06"]

[dependencies]
slint-realtime-plot = { workspace = true }
slint = { workspace = true, features = ["accessibility"] }

[build-dependencies]
slint-build = { workspace = true }

[package.metadata.android]
package = "com.okhsunrog.slint_plot"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 33

[package.metadata.android.application]
label = "Slint Plot"

# Slint's backend-android-activity-06 runs inside NativeActivity; without an
# explicit activity + LAUNCHER intent filter the app installs but has no icon.
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "slint_realtime_plotting_experiments"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
